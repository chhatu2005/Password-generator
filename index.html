<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <h1>Random Password Generator</h1>
        <label>Password Length</label>
        <input type="number" id="length" value="12" min="4" max="32">

        <div class="option">
            <label><input type="checkbox" id="uppercase" checked>Uppercase</label>
            <label><input type="checkbox" id="lowercase" checked>Lowercase</label>
            <label><input type="checkbox" id="number" checked>Number</label>
            <label><input type="checkbox" id="symbols" checked>Symbols</label>
        </div>

        <button id="generate">Generate Password</button>

        <div class="result">
            <input type="text" id="password" placeholder="Your Password" readonly>
            <button id="copy">Copy Password</button>
        </div>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
